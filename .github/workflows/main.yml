name: Copy MultiApp Source

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ATP repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone original MultiApp
        run: |
          git clone --depth 1 https://github.com/WaxMoon/MultiApp.git source

      - name: Copy original source code
        run: |
          rsync -av \
            --exclude='.git/' \
            source/ ./

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Import original MultiApp source"
          git push
