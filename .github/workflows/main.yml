
name: Import MultiApp Source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ATP repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Clone MultiApp
        run: |
          git clone --depth 1 \
            https://github.com/WaxMoon/MultiApp.git source

      - name: Copy source files
        run: |
          rsync -av \
            --exclude='.git/' \
            source/ ./

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Import original MultiApp source"
          git push origin HEAD:main
